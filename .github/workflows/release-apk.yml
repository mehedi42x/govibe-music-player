name: Build and publish GoVibe APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create (for example v0.2.0)'
        required: true
        type: string
      release_name:
        description: 'Release title'
        required: true
        type: string
      release_notes:
        description: 'Release notes'
        required: false
        type: string
      draft:
        description: 'Create a draft release for review (recommended)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Build, sign, and attach Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out selected source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Verify preinstalled Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo 'Android SDK is unavailable on this runner.' >&2
            exit 1
          fi
          NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-$SDK_ROOT/ndk/27.2.12479018}}"
          if [[ ! -d "$NDK_HOME" ]]; then
            echo "Required NDK $NDK_HOME is not preinstalled. Install it only after reviewing its license; this workflow will not accept SDK licenses." >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_HOME" >> "$GITHUB_ENV"

      - name: Set up Rust Android targets and cargo-ndk
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Load release signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/govibe-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Verify Rust core
        run: |
          cargo fmt --manifest-path rust/govibe-core/Cargo.toml -- --check
          cargo test --manifest-path rust/govibe-core/Cargo.toml
          cargo clippy --manifest-path rust/govibe-core/Cargo.toml --all-targets -- -D warnings

      - name: Build signed release APK
        run: ./gradlew --no-daemon :app:assembleRelease --stacktrace
        working-directory: android

      - name: Verify APK signature and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo 'apksigner was not found; refusing to publish an unverified APK.' >&2
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK"
          sha256sum "$APK" > app/build/outputs/apk/release/SHA256SUMS.txt
        working-directory: android

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          body: ${{ inputs.release_notes }}
          draft: ${{ inputs.draft }}
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt

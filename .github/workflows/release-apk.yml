name: GoVibe experimental debug APK
on:
  workflow_dispatch:
    inputs:
      tag_name: {description: Release tag, required: true, type: string}
permissions: {contents: write}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - shell: bash
        run: |
          set -eu
          s="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -d "$s" ] || { echo 'Android SDK missing; no SDK install/licenses.' >&2; exit 1; }
          for p in platforms/android-36 build-tools/35.0.0 ndk/27.2.12479018; do
            [ -d "$s/$p" ] || { echo "Missing preinstalled $p; no SDK install/license acceptance." >&2; exit 1; }
          done
          echo "ANDROID_HOME=$s" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$s/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android && cargo install cargo-ndk --locked
      - run: ./gradlew --no-daemon :app:assembleDebug
        working-directory: android
      - run: |
          set -eu
          a=app/build/outputs/apk/debug/app-debug.apk
          test -s "$a"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$a"
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
        working-directory: android
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: GoVibe 0.2.0-native-review - Experimental Debug APK
          body: |
            EXPERIMENTAL TEST BUILD — DEBUG-SIGNED; NOT FOR PRODUCTION.
            Android auto-generated debug key. SHA-256 in SHA256SUMS.txt.
          draft: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt

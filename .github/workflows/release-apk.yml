name: GoVibe experimental debug APK
on:
  workflow_dispatch:
    inputs:
      tag_name: {description: Release tag, required: true, type: string}
permissions: {contents: write}
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - shell: bash
        run: |
          set -eu
          s="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "$s" ] && [ -d "$s" ] || { echo 'Android SDK missing; no SDK install/licenses.' >&2; exit 1; }
          [ -s "$s/platforms/android-37/android.jar" ] || { echo "Missing preinstalled Android SDK API 37 under $s/platforms/android-37; no SDK install/license acceptance." >&2; exit 1; }
          b="$s/build-tools/36.0.0"
          for t in aapt apksigner zipalign; do
            [ -x "$b/$t" ] || { echo "Missing preinstalled Build Tools 36.0.0 executable: $b/$t; no SDK install/license acceptance." >&2; exit 1; }
          done
          n="$s/ndk/27.3.13750724"
          [ -d "$n" ] && [ -f "$n/source.properties" ] || { echo "Missing preinstalled NDK 27.3.13750724 under $s/ndk; no SDK/NDK install/license acceptance." >&2; exit 1; }
          rev="$(awk -F= '/^Pkg.Revision[[:space:]]*=/ {gsub(/[[:space:]]/, "", $2); print $2; exit}' "$n/source.properties")"
          [ "$rev" = '27.3.13750724' ] || { echo "Preinstalled NDK revision mismatch: expected 27.3.13750724, found $rev." >&2; exit 1; }
          echo "ANDROID_HOME=$s" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$s" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$n" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$n" >> "$GITHUB_ENV"
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android && cargo install cargo-ndk --locked
      - run: ./gradlew --no-daemon :app:assembleDebug
        working-directory: android
      - run: |
          set -eu
          a=app/build/outputs/apk/debug/app-debug.apk
          test -s "$a"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$a"
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
        working-directory: android
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: GoVibe 0.2.0-native-review - Experimental Debug APK
          body: |
            EXPERIMENTAL TEST BUILD — DEBUG-SIGNED; NOT FOR PRODUCTION.
            Android auto-generated debug key. SHA-256 in SHA256SUMS.txt.
          draft: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt

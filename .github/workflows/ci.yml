name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-rust:
    name: Verify Rust queue core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Formatting
        run: cargo fmt --manifest-path rust/govibe-core/Cargo.toml -- --check
      - name: Unit tests
        run: cargo test --manifest-path rust/govibe-core/Cargo.toml
      - name: Lint
        run: cargo clippy --manifest-path rust/govibe-core/Cargo.toml --all-targets -- -D warnings

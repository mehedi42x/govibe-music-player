version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    labels: [dependencies]
  - package-ecosystem: cargo
    directory: /rust/govibe-core
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]

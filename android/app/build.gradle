plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.kapt'
}

def rustBuildProfile = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } ? 'release' : 'debug'
def rustJniOutput = layout.buildDirectory.dir('generated/jniLibs/rust')

def rustBuildTask = tasks.register('buildRustCore', Exec) {
    group = 'build'
    description = 'Build the Rust playback engine for Android ABIs without accepting SDK licenses.'
    inputs.files(fileTree('../../rust') { include '**/*' })
    inputs.file('../../scripts/build-android-rust.sh')
    inputs.property('rustBuildProfile', rustBuildProfile)
    outputs.dir(rustJniOutput)
    workingDir rootProject.file('../rust/govibe-core')
    commandLine 'bash', rootProject.file('../scripts/build-android-rust.sh').absolutePath, rustJniOutput.get().asFile.absolutePath, rustBuildProfile
}

android {
    namespace 'com.aurora.musicplayer'
    compileSdk 37
    buildToolsVersion '36.0.0'
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'com.aurora.musicplayer'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '0.2.0-native-review'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (keystorePath != null && !keystorePath.isBlank()) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    sourceSets {
        main {
            jniLibs.srcDir(rustJniOutput.get().asFile)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['/META-INF/LICENSE*', '/META-INF/NOTICE*']
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(rustBuildTask)
}

kapt {
    correctErrorTypes = true
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    androidTestImplementation platform('androidx.compose:compose-bom:2026.09.00')

    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.10.2'

    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-session:1.11.1'

    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    kapt 'androidx.room:room-compiler:2.8.5'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
